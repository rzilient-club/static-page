  "/api/external/v1/order/{id}/tracking":
    put:
      summary: tracking
      tags:
      - Api::External::V1::Order
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        example: Bearer YPP3G24db3PReZeioRTc/8IHBRhTJWtAZExlwKITtlI=
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: 06b70ba9-cce5-443c-a731-e17407e48440
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tracking:
                  type: object
                  properties:
                    status:
                      type: string
                    url:
                      type: string
                    number:
                      type: string
                    carrier:
                      type: string
                  required:
                  - status
                  - url
                  - number
                  - carrier
              required:
              - tracking
            example:
              tracking:
                status: pending
                url: https://rzilient.club
                number: '11212131'
                carrier: DHL
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                tracking:
                  type: object
                  properties:
                    status:
                      type: string
                    number:
                      type: string
                    url:
                      type: string
                    carrier:
                      type: string
                  required:
                  - status
                  - number
                  - url
                  - carrier
              required:
              - tracking
            example:
              tracking:
                status: Shipped
                number: 1Z999AA10123456784
                url: https://www.ups.com/track?tracknum=1Z999AA10123456784
                carrier: UPS
      responses:
        '200':
          description: appends tracking information to the order
  "/api/external/v1/ping":
    get:
      summary: ping
      tags:
      - Api::External::V1::Endpoint
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        example: Bearer invalid_token
      responses:
        '200':
          description: returns 200 with valid token
        '401':
          description: returns 401 with invalid token
          content:
            text/plain:
              schema:
                type: string
              example: 'HTTP Token: Access denied.

                '
