name: Update Status Data

on:
  schedule:
    - cron: '*/20 * * * *'   # Every 5 minutes
  workflow_dispatch:          # Manual trigger

permissions:
  contents: write

concurrency:
  group: status-update
  cancel-in-progress: true

jobs:
  fetch-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch Honeybadger status
        env:
          HB_TOKEN: ${{ secrets.HB_TOKEN }}
        run: |
          chmod +x fetch-status.sh
          OUTPUT_DIR="." ./fetch-status.sh

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status-data.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update status-data.json [skip ci]"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger DigitalOcean deploy
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.DO_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://api.digitalocean.com/v2/apps/${{ secrets.DO_APP_ID }}/deployments" \
            -d '{"force_build": true}'